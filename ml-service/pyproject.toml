[project]
name = "career-recommender-ml"
version = "0.1.0"
description = "Hybrid ML Recommendation Engine & Grounded RAG Roadmap Microservice"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "sentence-transformers>=3.3.0",
    "numpy>=1.26.4",
    "pypdf>=5.1.0",
    "google-genai>=1.0.0",
    "openai>=1.55.0",
    "torch>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
